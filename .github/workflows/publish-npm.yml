name: Publish npm packages

on:
  push:
    tags:
      - 'npm-release-*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-production
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish unpublished package versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a release commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build publishable packages
        run: npx nx run-many -t build -p neural-ng neural-icons neural-editor neural-theme neural-mcp

      - name: Test package contracts
        run: npm run package:test

      - name: Test icons package
        run: npx nx test neural-icons

      - name: Run external consumer smoke test
        run: npm run package:smoke

      - name: Run MCP smoke test
        run: npm run mcp:smoke

      - name: Publish new versions
        run: node tools/publish-packages.mjs
