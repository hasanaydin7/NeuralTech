name: Feature request
description: Propose a user-facing component, API or documentation improvement.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Include typed Angular usage when proposing an API.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contracts
    attributes:
      label: Contract impact
      options:
        - label: I considered accessibility and keyboard behavior.
        - label: I considered SSR and hydration behavior.
        - label: I considered AI-readable README and llms.txt documentation.
