server {
    listen 80;
    listen [::]:80;
    server_name neuralng.dev www.neuralng.dev;

    return 301 https://neuralng.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name neuralng.dev www.neuralng.dev;

    ssl_certificate /etc/ssl/cloudflare/neuralng-origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/neuralng-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NeuralNgSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/neuralng-cloudflare-realip.conf;

    access_log /var/log/nginx/neuralng.access.log;
    error_log /var/log/nginx/neuralng.error.log;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
