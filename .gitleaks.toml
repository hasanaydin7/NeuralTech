title = "NeuralTech secret scanning"
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Generated SHA-256 integrity hashes are public build metadata."
condition = "AND"
regexTarget = "line"
paths = ['''^libs/neural-theme/assets/presets/quality-baseline\.json$''']
regexes = ['''"(sourceHash|cssSha256|tokensSha256|reportSha256)": "[a-f0-9]{64}"''']
